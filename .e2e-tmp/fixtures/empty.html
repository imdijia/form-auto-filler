<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>v2 夹具 - 容器子树内可填控件数为 0</title>
<!--
  QA v2 静态夹具。无外链资源、无远程字体、无协议 URL 字面。
  判别意图（AC-V2-12）：dialog 子树内可见可填控件数为 0（只有纯文本与跳过类控件），
  触发后必须显示空状态文字、不得报错、不得写入任何值、不得点击提交。
  容器外仍放搜索框与普通文本框，用于确认空状态不是因为「误选到容器外」。
-->
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; color: #1f2a3d; background: #f4f6f9; }
  .search-bar { border: 1px solid #c8d2e0; background: #fff; padding: 10px 12px; margin-bottom: 14px; }
  .search-bar label { display: inline-block; margin-right: 6px; font-size: 13px; }
  .search-bar input, .search-bar select { margin-right: 14px; padding: 3px 6px; }
  .ant-modal { border: 1px solid #7d90ab; background: #fff; max-width: 720px; padding: 0 0 14px; border-radius: 6px; }
  .ant-modal-title { padding: 10px 16px; background: #e8eef6; font-weight: 600; border-bottom: 1px solid #c8d2e0; }
  .ant-modal-body { padding: 10px 16px; }
  .skip-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; margin-top: 10px; }
  .skip-grid .form-row label { width: 132px; }
  .skip-grid input { width: 170px; }
  .form-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .form-row label { width: 132px; font-size: 13px; flex: none; }
  .form-row input { padding: 3px 6px; font: inherit; box-sizing: border-box; }
  .page-actions { padding: 6px 16px 0; }
  .page-actions button { padding: 5px 16px; font: inherit; cursor: pointer; }
</style>
</head>
<body data-page="empty">

<div class="search-bar" id="outside-search">
  <label for="global-search">全局搜索</label>
  <input id="global-search" name="globalSearch" type="search" placeholder="搜索关键字">
  <label for="global-filter">筛选状态</label>
  <select id="global-filter" name="globalFilter"><option value="">全部</option><option value="draft">草稿</option></select>
  <label for="outside-text">容器外备注</label>
  <input id="outside-text" name="outsideText" type="text" value="OUTSIDE-SENTINEL">
</div>

<div role="dialog" id="empty-dialog" class="ant-modal" aria-label="只读详情">
  <div class="ant-modal-title">只读详情（无可填控件）</div>
  <div class="ant-modal-body">
    <p>本弹窗仅展示信息，不包含任何可填写的可见输入控件。</p>
    <div class="skip-grid">
      <div class="form-row"><label for="e-readonly">只读编号</label><input id="e-readonly" type="text" readonly value="SENTINEL-E-READONLY"></div>
      <div class="form-row"><label for="e-disabled">禁用项</label><input id="e-disabled" type="text" disabled value="SENTINEL-E-DISABLED"></div>
      <div class="form-row"><label for="e-hidden">隐藏项</label><input id="e-hidden" type="text" hidden value="SENTINEL-E-HIDDEN"></div>
      <div class="form-row"><label for="e-display-none">display none</label><input id="e-display-none" type="text" style="display:none" value="SENTINEL-E-DISPLAY"></div>
      <div class="form-row"><label for="e-password">密码</label><input id="e-password" type="password" value="SENTINEL-E-PASSWORD"></div>
      <div class="form-row"><label for="e-hidden-type">隐藏载体</label><input id="e-hidden-type" type="hidden" value="SENTINEL-E-HIDDEN-TYPE"></div>
    </div>
  </div>
  <div class="page-actions">
    <button type="button" id="submit-btn">页面提交登记</button>
  </div>
</div>

<script>
(function () {
  window.__qa = { submitClicks: 0, submitEvents: 0, errors: [] };
  document.getElementById('submit-btn').addEventListener('click', function () { window.__qa.submitClicks += 1; });
  document.addEventListener('submit', function (e) { e.preventDefault(); window.__qa.submitEvents += 1; }, true);
  window.addEventListener('error', function (e) { window.__qa.errors.push(String(e.message)); });
  window.addEventListener('unhandledrejection', function (e) { window.__qa.errors.push('rejection:' + String(e.reason)); });
})();
</script>
</body>
</html>
